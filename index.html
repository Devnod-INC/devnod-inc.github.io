<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevNod-INC | Especialistas en Soluciones Complejas</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-blue: #1f6feb;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 5px;
            font-size: 2rem;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Simulación de botón de Google para tu flujo */
        .btn-google {
            background-color: #fff;
            color: #1f1f1f;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            transition: background 0.2s;
        }

        .btn-google:hover {
            background-color: #e1e1e1;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
            margin-top: 20px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, textarea {
            background: var(--bg-color);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            color: #fff;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-submit {
            background-color: var(--accent-blue);
            color: #fff;
            border: 1px solid rgba(240,246,252,0.1);
            padding: 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #388bfd;
        }

        .user-badge {
            background: #21262d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none; /* Se activará con JS al loguear con Google */
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Puedes cambiar esta ruta cuando subas tu logo al repositorio -->
        <h1>DevNod-INC</h1>
        <p class="tagline">Especialistas en soluciones complejas.</p>

        <!-- Bloque de Autenticación de Google -->
        <button class="btn-google" id="google-login-btn">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/copy_badge.svg" alt="Google" width="18">
            Identificarse con Google
        </button>

        <div class="user-badge" id="user-info">
            Conectado como: <strong id="user-email"></strong>
        </div>

        <!-- Tu formulario que procesará Formspree -->
        <!-- Reemplaza "TU_ENDPOINT_FORMSPREE" por el ID real que te den en Formspree -->
        <form action="https://formspree.io/f/TU_ENDPOINT_FORMSPREE" method="POST" id="contact-form">
            
            <label for="name">Nombre Verificado</label>
            <input type="text" name="name" id="form-name" placeholder="Inicia sesión para autocompletar" required readonly>

            <label for="email">Correo Electrónico</label>
            <input type="email" name="_replyto" id="form-email" placeholder="Inicia sesión para autocompletar" required readonly>

            <label for="message">Requerimiento de Arquitectura Compleja</label>
            <textarea name="message" id="message" rows="5" placeholder="Escribe los detalles de tu aplicación..." required></textarea>

            <button type="submit" class="btn-submit">Enviar Requerimiento</button>
        </form>
    </div>

    <script>
        // Aquí irá tu lógica para capturar el token de Google,
        // remover el botón de login, mostrar el 'user-badge' y quitar el 'readonly' del formulario.
        document.getElementById('google-login-btn').addEventListener('click', () => {
            alert('¡Aquí conectarás el SDK de Google Client Auth!');
            
            // Simulación de respuesta exitosa de Google:
            document.getElementById('form-name').value = "Usuario Verificado";
            document.getElementById('form-email').value = "contacto@ejemplo.com";
            document.getElementById('user-email').innerText = "contacto@ejemplo.com";
            document.getElementById('user-info').style.display = "block";
            document.getElementById('google-login-btn').style.display = "none";
        });
    </script>
</body>
</html>
