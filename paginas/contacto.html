<section class="contact-node">
    <div class="node-header">
        <h1>Contacto y Asesoría</h1>
        <p>Estamos listos para ayudarte. Envíanos tu solicitud y te responderemos a la brevedad.</p>
    </div>

    <div id="auth-area" style="text-align: center; padding: 2rem;">
        <button id="btn-login" class="btn-primary" style="padding: 1rem 2rem;">
            🔐 Ingresar con Google para enviar requerimiento
        </button>
    </div>

    <form id="contactForm" style="display:none;">
        <div id="user-info" style="margin-bottom: 1rem; color: #58a6ff; font-weight: bold;"></div>
        
        <input type="hidden" name="user_name" id="user_name">
        <input type="hidden" name="user_email" id="user_email">
        
        <div class="form-group">
            <label for="servicio">Categoría de Ingeniería:</label>
            <select id="servicio" name="servicio" required>
                <option value="">Cargando catálogo...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="mensaje">Cuéntanos sobre tu proyecto o consulta:</label>
            <textarea id="mensaje" name="message" rows="8" placeholder="Describa el alcance..." required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" id="btn-submit" class="btn-primary">Enviar Solicitud</button>
        </div>
    </form>

    <div id="success-message" style="display:none; text-align: center; padding: 2rem; background: #161b22; border-radius: 8px;">
        <h3 style="color: #238636;">✅ Solicitud enviada correctamente.</h3>
        <p style="color: #8b949e;">Hemos recibido tu mensaje correctamente. Nuestro equipo se pondrá en contacto contigo pronto.</p>
    </div>
</section>

<style>
    .contact-node { max-width: 600px; margin: 2rem auto; padding: 2rem; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: #c9d1d9; font-weight: bold; }
    .form-group select, .form-group textarea { width: 100%; padding: 0.8rem; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 4px; }
    .btn-primary { width: 100%; padding: 1rem; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
    .btn-primary:hover { background: #2ea043; }
    .btn-primary:disabled { background: #161b22; color: #8b949e; cursor: not-allowed; }
</style>
