<section class="blog-section">
    <div class="blog-header">
        <h2>Centro de Monitoreo & Feeds RSS</h2>
        <p class="text-muted">Flujo de actualización automatizado cada 6 horas a través de GitHub Actions.</p>
        
        <div class="search-container">
            <input type="text" id="rss-search" placeholder="Filtrar noticias por título o fuente..." oninput="filtrarFeeds()">
        </div>
    </div>

    <div class="rss-grid" id="rss-container">
        <div class="loader-placeholder">Sincronizando con el nodo de noticias...</div>
    </div>
</section>

<script>
    // Guardamos las noticias globalmente en este fragmento para el filtro rápido
    let todasLasNoticias = [];

    // Diccionario para transformar el "source" técnico en etiquetas visuales elegantes
    const fuentesConfig = {
        "sophos_threat": { nombre: "Sophos Threat", color: "#ff7b72", bg: "rgba(255,123,114,0.1)" },
        "sophos_ops": { nombre: "Sophos Ops", color: "#ffa657", bg: "rgba(255,166,87,0.1)" },
        "aws_news": { nombre: "AWS What's New", color: "#f29d38", bg: "rgba(242,157,56,0.1)" },
        "gcp_cloud": { nombre: "Google Cloud", color: "#79c0ff", bg: "rgba(121,192,255,0.1)" },
        "suse_news": { nombre: "SUSE Linux", color: "#56d364", bg: "rgba(86,211,100,0.1)" },
        "broadcom_vmware": { nombre: "VMware VCF", color: "#d2a8ff", bg: "rgba(210,168,255,0.1)" },
        "veeam_intel": { nombre: "Veeam Intel", color: "#388bfd", bg: "rgba(56,139,253,0.1)" },
        "hackerrank": { nombre: "HackerRank Tech", color: "#2ea44f", bg: "rgba(46,164,79,0.1)" }
    };

    function cargarFeeds() {
        // Cache busting para evitar datos viejos atrapados en el navegador
        fetch(`./data/feeds.json?v=${new Date().getTime()}`)
            .then(res => {
                if (!res.ok) throw new Error("No se pudo acceder al repositorio de feeds.");
                return res.json();
            })
            .then(data => {
                todasLasNoticias = data;
                renderizarTarjetas(todasLasNoticias);
            })
            .catch(err => {
                document.getElementById('rss-container').innerHTML = `
                    <div style="color: #ff7b72; text-align: center; width: 100%; padding: 40px;">
                        ⚠️ Error en el flujo de sincronización: ${err.message}
                    </div>`;
            });
    }

    function renderizarTarjetas(noticias) {
        const container = document.getElementById('rss-container');
        if (!container) return;

        if (noticias.length === 0) {
            container.innerHTML = `<div class="loader-placeholder" style="grid-column: 1/-1;">No se encontraron registros que coincidan con la búsqueda.</div>`;
            return;
        }

        container.innerHTML = noticias.map(item => {
            // Buscamos la configuración de diseño de la fuente, o usamos una genérica
            const srcInfo = fuentesConfig[item.source] || { nombre: item.source, color: "#c9d1d9", bg: "#21262d" };
            
            // Limpieza de formato de fecha simple
            const fechaFormateada = new Date(item.date).toLocaleDateString('es-ES', {
                day: '2-digit', month: 'short', year: 'numeric'
            });

            return `
                <article class="rss-card">
                    <div class="card-meta">
                        <span class="source-badge" style="color: ${srcInfo.color}; background-color: ${srcInfo.bg}; border: 1px solid ${srcInfo.color}33;">
                            ${srcInfo.nombre}
                        </span>
                        <time class="card-date">${fechaFormateada}</time>
                    </div>
                    <h3 class="card-title">${item.title}</h3>
                    <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="card-link">
                        Leer reporte original ↗
                    </a>
                </article>
            `;
        }).join('');
    }

    function filtrarFeeds() {
        const query = document.getElementById('rss-search').value.toLowerCase();
        const filtradas = todasLasNoticias.filter(item => {
            const fuenteNombre = fuentesConfig[item.source]?.nombre.toLowerCase() || item.source.toLowerCase();
            return item.title.toLowerCase().includes(query) || fuenteNombre.includes(query);
        });
        renderizarTarjetas(filtradas);
    }

    // Ejecutamos la carga inmediata al montar el componente
    cargarFeeds();
</script>
