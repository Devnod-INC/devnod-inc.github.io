<!-- Estructura del Carrusel -->
<section id="banner-container" class="hero-banner">
    <!-- Capa interna para el efecto de transición -->
    <div id="banner-layer" class="banner-layer"></div>
    
    <div class="hero-overlay">
        <div class="hero-content">
            <h2 class="banner-text">Brindando servicios desde 2004</h2>
            <p>Infraestructura y Software para tu Crecimiento.</p>
        </div>
    </div>
</section>

<section class="app-container">
    <p id="hero-description" style="text-align: center; margin-bottom: 30px;"></p>
    <div id="features-container" class="stack-grid"></div>
</section>

<style>
.hero-banner {
        position: relative;
        width: 100%;
        aspect-ratio: 21 / 9;
        border-radius: 8px;
        margin-bottom: 40px;
        overflow: hidden; /* Importante para que la imagen no se salga */
        background: #000;
    }

    .banner-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-size: cover;
        background-position: center;
        transition: opacity 1.5s ease-in-out; /* Esta es la clave de la transición */
        z-index: 1;
    }

    .hero-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
    }
    
    .hero-content { text-align: center; color: white; }
    .banner-text { font-family: 'Courier Prime', monospace; font-size: 2.5rem; }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const layer = document.getElementById('banner-layer');
        
        // Si por alguna razón no encuentra la capa, detenemos el script para evitar errores
        if (!layer) {
            console.error("No se encontró el banner-layer");
            return;
        }

        let i = 1;
        
        // Inicializar con la ruta relativa que sabemos que te funciona
        layer.style.backgroundImage = "url('../images/VINTAGE1.jpg')";
        
        // Función para cambiar imagen con desvanecimiento
        function changeImage() {
            i = (i % 9) + 1;
            // Primero desvanecemos
            layer.style.opacity = 0;
            
            setTimeout(() => {
                // Usamos ../images/ en lugar de /images/
                layer.style.backgroundImage = `url('../images/VINTAGE${i}.jpg')`;
                layer.style.opacity = 1; // Volvemos a mostrar
            }, 1500); // El tiempo coincide con la transición CSS
        }

        setInterval(changeImage, 5000);
    });
</script>

<!-- Carga de fuente externa para el estilo vintage -->
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
