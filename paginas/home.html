<!-- Estructura del Carrusel -->
<section id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <!-- Prueba de diagnóstico -->
<div style="padding: 20px; background: #222; color: #fff;">
    <h3>Diagnóstico de Ruta:</h3>
    
    <!-- Prueba 1: Ruta relativa -->
    <p>Prueba 1 (../images/VINTAGE1.jpg): 
       <img src="../images/VINTAGE1.jpg" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" style="width:100px;">
       <span style="display:none; color:red;">[FALLÓ]</span>
    </p>

    <!-- Prueba 2: Ruta desde raíz -->
    <p>Prueba 2 (/images/VINTAGE1.jpg): 
       <img src="/images/VINTAGE1.jpg" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" style="width:100px;">
       <span style="display:none; color:red;">[FALLÓ]</span>
    </p>
    
    <!-- Prueba 3: Ruta local directa -->
    <p>Prueba 3 (images/VINTAGE1.jpg): 
       <img src="images/VINTAGE1.jpg" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" style="width:100px;">
       <span style="display:none; color:red;">[FALLÓ]</span>
    </p>
</div>
    
    <!-- Overlay con el mensaje de marca -->
    <div class="hero-overlay">
        <div class="hero-content">
            <h2 class="banner-text">Brindando servicios desde 2004</h2>
            <p>Infraestructura y Software para tu Crecimiento.</p>
        </div>
    </div>
</section>

<section class="app-container">
    <p id="hero-description" style="text-align: center; margin-bottom: 30px;"></p>
    <div id="features-container" class="stack-grid"></div>
</section>

<style>
    /* Aseguramos que el carrusel ocupe el mismo espacio que tu banner antiguo */
    #heroCarousel {
        position: relative;
        width: 100%;
        aspect-ratio: 21 / 9; /* Esto mantiene la proporción original */
        border-radius: 8px;
        margin-bottom: 40px;
        overflow: hidden;
    }

    .hero-banner {
        width: 100%;
        aspect-ratio: 21 / 9;
        background-size: cover;
        background-position: center;
        border-radius: 8px;
    }

    /* Forzamos a la imagen a rellenar el carrusel */
    .carousel-inner, .carousel-item {
        width: 100%;
        height: 100%;
    }

    .carousel-item img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Esto es vital para que no se deforme */
    }

    .hero-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .hero-content {
        text-align: center;
        color: white;
    }
    
    .banner-text {
        font-family: 'Courier Prime', monospace;
        font-size: 2.5rem;
    }
</style>

<script>
    (function() {
        const container = document.getElementById('carousel-images');
        for (let i = 1; i <= 9; i++) {
            const activeClass = (i === 1) ? 'active' : '';
            // Usamos un div con background-image, tal como funcionaba tu banner original
            container.innerHTML += `
                <div class="carousel-item ${activeClass} hero-banner" 
                     style="background-image: url('../images/VINTAGE${i}.jpg');">
                </div>
            `;
        }
    })();
</script>

<!-- Carga de fuente externa para el estilo vintage -->
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
