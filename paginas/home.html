<!-- Estructura del Carrusel -->
<section id="banner-container" class="hero-banner">
    <div class="hero-overlay">
        <div class="hero-content">
            <h2 class="banner-text">Brindando servicios desde 2004</h2>
            <p>Infraestructura y Software para tu Crecimiento.</p>
        </div>
    </div>
</section>

<section class="app-container">
    <p id="hero-description" style="text-align: center; margin-bottom: 30px;"></p>
    <div id="features-container" class="stack-grid"></div>
</section>

<style>
    /* Aseguramos que el carrusel ocupe el mismo espacio que tu banner antiguo */
    #heroCarousel {
        position: relative;
        width: 100%;
        aspect-ratio: 21 / 9; /* Esto mantiene la proporción original */
        border-radius: 8px;
        margin-bottom: 40px;
        overflow: hidden;
    }

.hero-banner {
        position: relative;
        width: 100%;
        aspect-ratio: 21 / 9;
        background-image: url('/images/VINTAGE1.jpg'); /* Ruta comprobada */
        background-size: cover;
        background-position: center;
        border-radius: 8px;
        margin-bottom: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-image 1s ease-in-out;
    }
    .hero-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
    }
    .hero-content { z-index: 2; text-align: center; color: white; }
    .banner-text { font-family: 'Courier Prime', monospace; font-size: 2.5rem; }

    /* Forzamos a la imagen a rellenar el carrusel */
    .carousel-inner, .carousel-item {
        width: 100%;
        height: 100%;
    }

    .carousel-item img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Esto es vital para que no se deforme */
    }
    
    .banner-text {
        font-family: 'Courier Prime', monospace;
        font-size: 2.5rem;
    }
</style>

<script>
    (function() {
        const banner = document.getElementById('banner-container');
        let i = 1;
        
        // Cambia la imagen cada 5 segundos
        setInterval(() => {
            i = (i % 9) + 1;
            banner.style.backgroundImage = `url('/images/VINTAGE${i}.jpg')`;
        }, 5000);
    })();
</script>

<!-- Carga de fuente externa para el estilo vintage -->
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
